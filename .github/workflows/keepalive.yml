name: Keep GitHub Actions Active (keepalive)

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update keepalive stamp and push
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          branch="keepalive"
          git checkout -B "$branch"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/KEEPALIVE
          git add .github/KEEPALIVE
          git commit -m "chore: keepalive [skip ci]" || echo "No changes to commit"
          git push origin "HEAD:$branch"

